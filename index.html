<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0c1016">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>CalcuTaxi</title>
<script>try{var t=localStorage.getItem('tema');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{
  --bg:#0c1016;--surface:#141a22;--line:#232c38;--text:#e9edf2;--muted:#8b97a7;--faint:#566172;
  --accent:#f6c744;--final-bg:rgba(22,28,37,.92);
  color-scheme:dark;
}
[data-theme="light"]{
  --bg:#f2f4f7;--surface:#fff;--line:#e0e5eb;--text:#10151c;--muted:#5d6978;--faint:#9aa5b3;
  --accent:#c98a00;--final-bg:rgba(16,21,28,.96);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  font-variant-numeric:tabular-nums;line-height:1.4;
  transition:background-color .25s,color .25s;
}
.wrap{max-width:480px;margin:0 auto;padding:max(22px,env(safe-area-inset-top)) 20px 20px}

.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}
.logo{display:flex;align-items:center;gap:12px;margin:0}
.logo-mark{width:38px;height:38px;flex:none}
[data-theme="dark"] .logo-mark{filter:drop-shadow(0 4px 16px rgba(246,199,68,.28))}
.logo-text{font-size:26px;line-height:1;letter-spacing:-.04em;color:var(--text)}
.logo-text span{font-weight:500}
.logo-text b{font-weight:800}
.icon-btn{
  width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);
  color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:color .2s,border-color .2s;
}
.icon-btn:hover{color:var(--text)}
.icon-btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
[data-theme="dark"] .i-luna,[data-theme="light"] .i-sol{display:none}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.field{margin-bottom:18px}
label{display:block;margin-bottom:8px;font-size:14px;font-weight:500;color:var(--muted)}
input[type="text"],textarea{
  display:block;width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:14px;
  background:var(--surface);color:var(--text);font:inherit;font-size:18px;font-weight:500;
  transition:border-color .2s,box-shadow .2s;
}
input[type="text"]{-moz-appearance:textfield;appearance:textfield}
input[type="text"]::-webkit-inner-spin-button,input[type="text"]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
textarea{height:96px;line-height:1.4;resize:none;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
::placeholder{color:var(--faint);font-weight:400}
input:focus,textarea:focus{
  outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent);
}

.suma{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;font-size:13px;color:var(--muted)}
.suma b{color:var(--text);font-size:15px;font-weight:600}

.rows{margin:4px 0 30px;border-top:1px solid var(--line)}
.row{
  display:flex;justify-content:space-between;align-items:baseline;padding:13px 0;
  border-bottom:1px solid var(--line);font-size:15px;color:var(--muted);
}
.row b{color:var(--text);font-size:17px;font-weight:600}

.final{
  position:sticky;bottom:max(14px,env(safe-area-inset-bottom));margin-top:32px;padding:14px 20px 16px;
  border-radius:24px;background:var(--final-bg);border:1px solid rgba(255,255,255,.08);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 14px 36px rgba(0,0,0,.35);
}
.final span{display:block;font-size:13px;font-weight:500;color:#9aa6b6}
.final strong{
  display:block;margin-top:2px;font-size:clamp(30px,9vw,42px);font-weight:700;
  letter-spacing:-.02em;line-height:1.1;color:#f6c744;
}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <h1 class="logo" aria-label="CalcuTaxi">
      <svg class="logo-mark" viewBox="0 0 40 40" aria-hidden="true">
        <rect width="40" height="40" rx="11" fill="#f6c744"/>
        <rect x="8" y="9" width="24" height="9" rx="3" fill="#10151c"/>
        <rect x="19" y="12.8" width="10" height="2.4" rx="1.2" fill="#f6c744"/>
        <path fill="#10151c" d="M8 23h4v4H8zM16 23h4v4h-4zM24 23h4v4h-4zM12 27h4v4h-4zM20 27h4v4h-4zM28 27h4v4h-4z"/>
      </svg>
      <span class="logo-text" aria-hidden="true"><span>Calcu</span><b>Taxi</b></span>
    </h1>
    <button id="tema" class="icon-btn" type="button" aria-label="Cambiar entre modo oscuro y claro">
      <svg class="i-luna" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="i-sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <div class="field">
    <label for="totalTaximetro">1. Total de Taxímetro ($)</label>
    <input type="text" id="totalTaximetro" inputmode="decimal" autocomplete="off" placeholder="Ej: 15000">
  </div>

  <div class="field">
    <label for="viajesUber">2. Total Viajes de Uber ($)</label>
    <input type="text" id="viajesUber" inputmode="decimal" autocomplete="off" placeholder="Ej: 5500">
  </div>

  <div class="field">
    <label for="uberTaximetro">3. Esos viajes de Uber en Taxímetro ($)</label>
    <textarea id="uberTaximetro" rows="2" placeholder="Pegá o escribí los importes. Ej: 3000 2500 4100"></textarea>
    <div class="suma"><span>Suma de <span id="cantUber">0</span> cifras</span><b id="totalUber">0,00</b></div>
  </div>

  <div class="rows">
    <div class="row"><span>Diferencia a restar</span><b id="diferenciaUber">0,00</b></div>
  </div>

  <div class="field">
    <label for="traslado">4. Traslado entre choferes (resta)</label>
    <input type="text" id="traslado" inputmode="decimal" autocomplete="off" placeholder="Ej: 200">
  </div>

  <div class="rows">
    <div class="row"><span>Subtotal 1</span><b id="subtotal1">0,00</b></div>
    <div class="row"><span>Mi ganancia (35%)</span><b id="miGanancia">0,00</b></div>
    <div class="row"><span>Subtotal 2 (para gastos)</span><b id="subtotal2">0,00</b></div>
  </div>

  <div class="field">
    <label for="gnc">5. Cargas de GNC (restan)</label>
    <textarea id="gnc" rows="2" placeholder="Pegá o escribí las cargas. Ej: 8500 9200 7800"></textarea>
    <div class="suma"><span>Suma de <span id="cantGNC">0</span> cifras</span><b id="totalGNC">0,00</b></div>
  </div>

  <div class="field">
    <label for="tickets">6. Tickets (resta)</label>
    <input type="text" id="tickets" inputmode="decimal" autocomplete="off" placeholder="Ej: 500">
  </div>

  <div class="field">
    <label for="compras">7. Compras para el vehículo (resta)</label>
    <input type="text" id="compras" inputmode="decimal" autocomplete="off" placeholder="Ej: 300">
  </div>

  <div class="field">
    <label for="lavado">8. Lavado (resta)</label>
    <input type="text" id="lavado" inputmode="decimal" autocomplete="off" placeholder="Ej: 1000">
  </div>

  <div class="final" id="final">
    <span>Neto final a rendir</span>
    <strong id="netoFinal">0,00</strong>
  </div>

</div>

<script>
    const $ = id => document.getElementById(id);
    const fmt = n => n.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    // Extrae todos los importes de un texto pegado (3500, 3.500, 3.500,50, 3500.50; separados por espacios, comas, saltos de línea...)
    function extraerNumeros(texto) {
        const tokens = texto.match(/\d[\d.,]*/g) || [];
        const nums = [];
        tokens.forEach(tk => {
            tk = tk.replace(/[.,]+$/, '');
            let m;
            if (/^\d+$/.test(tk)) {
                nums.push(parseFloat(tk));
            } else if ((m = tk.match(/^(\d{1,3}(?:\.\d{3})+),(\d{1,2})$/)) || (m = tk.match(/^(\d{1,3}(?:,\d{3})+)\.(\d{1,2})$/))) {
                nums.push(parseFloat(m[1].replace(/[.,]/g, '') + '.' + m[2]));   // 1.250,50
            } else if (/^\d{1,3}(?:[.,]\d{3})+$/.test(tk)) {
                nums.push(parseFloat(tk.replace(/[.,]/g, '')));                  // 1.500
            } else if (/^\d+[.,]\d{1,2}$/.test(tk)) {
                nums.push(parseFloat(tk.replace(',', '.')));                     // 12,5
            } else {
                tk.split(/[.,]/).forEach(p => { if (p) nums.push(parseFloat(p)); }); // 3000,2500,4100
            }
        });
        return nums;
    }

    function sumarTexto(texto) {
        const nums = extraerNumeros(texto);
        return { total: nums.reduce((a, b) => a + b, 0), cantidad: nums.length };
    }

    function calcularCaja() {
        const getVal = id => sumarTexto($(id).value).total;

        const totalTaximetro = getVal('totalTaximetro');
        const traslado = getVal('traslado');

        // Total viajes de Uber (un solo importe) y viajes de Uber en taxímetro (suma de lo pegado)
        const totalUber = getVal('viajesUber');
        const sumaTaxi = sumarTexto($('uberTaximetro').value);
        $('totalUber').textContent = fmt(sumaTaxi.total);
        $('cantUber').textContent = sumaTaxi.cantidad;

        // Diferencia de Uber (siempre positiva para que se reste)
        const diferenciaUber = Math.abs(totalUber - sumaTaxi.total);
        $('diferenciaUber').textContent = fmt(diferenciaUber);

        // Subtotal 1 (el traslado siempre resta)
        const subtotal1 = totalTaximetro - diferenciaUber - traslado;
        $('subtotal1').textContent = fmt(subtotal1);

        // Ganancia y Subtotal 2
        const miGanancia = subtotal1 * 0.35;
        const subtotal2 = subtotal1 - miGanancia;
        $('miGanancia').textContent = fmt(miGanancia);
        $('subtotal2').textContent = fmt(subtotal2);

        // Gastos (GNC = suma de lo pegado)
        const sumaGNC = sumarTexto($('gnc').value);
        $('totalGNC').textContent = fmt(sumaGNC.total);
        $('cantGNC').textContent = sumaGNC.cantidad;

        const totalGastos = sumaGNC.total + getVal('tickets') + getVal('compras') + getVal('lavado');

        // Neto final
        $('netoFinal').textContent = fmt(subtotal2 - totalGastos);
    }

    // Recalcular con cada cambio
    document.querySelectorAll('input[type="text"], textarea').forEach(el => {
        ['input', 'change', 'keyup'].forEach(ev => el.addEventListener(ev, calcularCaja));
    });

    // Modo oscuro por defecto; la elección se recuerda
    const metaTema = document.querySelector('meta[name="theme-color"]');
    function aplicarTema(tema) {
        document.documentElement.dataset.theme = tema;
        metaTema.content = tema === 'dark' ? '#0c1016' : '#f2f4f7';
        try { localStorage.setItem('tema', tema); } catch (e) {}
    }
    $('tema').addEventListener('click', () => {
        aplicarTema(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
    });
    aplicarTema(document.documentElement.dataset.theme);

    // Si el teclado tapa el neto final, lo sube para que se vea mientras cargás montos
    if (window.visualViewport) {
        const vv = window.visualViewport;
        const subir = () => {
            const tapado = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
            $('final').style.transform = 'translateY(' + (-tapado) + 'px)';
        };
        vv.addEventListener('resize', subir);
        vv.addEventListener('scroll', subir);
    }

    calcularCaja();

    // Permite instalarla como app y usarla sin internet
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>

</body>
</html>
